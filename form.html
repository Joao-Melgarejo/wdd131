<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Assignment: Product Review Form</title>
    <meta name="description" content="Product review form assignment for WDD 131.">
    <meta name="author" content="Joao Melgarejo">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating</legend>
                <div class="rating-group">
                    <label for="rating1">1</label>
                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating2">2</label>
                    <input type="radio" id="rating2" name="rating" value="2" required>

                    <label for="rating3">3</label>
                    <input type="radio" id="rating3" name="rating" value="3" required>

                    <label for="rating4">4</label>
                    <input type="radio" id="rating4" name="rating" value="4" required>

                    <label for="rating5">5</label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful in the product?</legend>
                <p class="hint">Check all that apply</p>

                <div class="checkbox-group">
                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="Durability">
                        Durability
                    </label>

                    <label for="easeOfUse">
                        <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="Performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" name="userName">
            </div>

            <div class="form-group">
                <input type="submit" value="Post Review">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Joao Melgarejo | Peru</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
