[build]
  publish = "."

[[redirects]]
  from = "/servicios"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/referencias"
  to = "/references.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
